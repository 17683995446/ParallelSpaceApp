name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Display file structure
        run: |
          echo "=== Current Directory ==="
          pwd
          ls -la
          echo ""
          echo "=== Gradle Wrapper Files ==="
          ls -la gradlew gradlew.bat gradle/wrapper/
          echo ""
          echo "=== Gradle Wrapper Properties ==="
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          echo "=== Starting Gradle Build ==="
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "=== Build Completed ==="
          echo "Exit code: $?"

      - name: Display build outputs
        if: always()
        run: |
          echo "=== Build Outputs ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No APK directory found"
          echo ""
          echo "=== Checking for Errors ==="
          find app/build -name "*.log" 2>/dev/null | head -5

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
